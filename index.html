<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Demandas</title>
<meta name="description" content="Dashboard da Esteira de Produção de Projetos: pontualidade, tempos de produção, fluxo por etapa, vazão e capacidade da equipe.">
<link rel="stylesheet" href="assets/style.css">
<script>try { const t = localStorage.getItem("esteira-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="titulo">Controle de Demandas</h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="controls">
      <a class="btn-link" href="admin/">Editar dados</a>
      <button id="theme" aria-label="Alternar tema">Tema</button>
    </div>
  </header>
  <p class="source" id="source">Carregando…</p>
  <div id="aviso"></div>
  <main id="dash"></main>
</div>

<script src="assets/core.js"></script>
<script src="assets/charts.js"></script>
<script>
(async () => {
  "use strict";
  const $ = id => document.getElementById(id);
  let estado;

  function render() {
    const doc = estado.data;
    document.title = doc.titulo || "Controle de Demandas";
    $("titulo").textContent = doc.titulo || "Controle de Demandas";
    $("subtitulo").textContent = doc.subtitulo || "";
    const { concluido } = CD.contexto(doc);
    const ativos = doc.projetos.filter(p => !concluido(p)).length;
    const quando = estado.atualizado ? ` · atualizado em ${new Date(estado.atualizado).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}` : "";
    $("source").textContent = `${doc.projetos.length} projetos · ${ativos} ativos${quando}`;
    CDCharts.desenharDashboard($("dash"), doc);
  }

  estado = await CD.carregar();
  if (estado.modo === "local") {
    $("aviso").innerHTML = `<p class="aviso"><b>Banco de dados não configurado.</b> Mostrando ${estado.novo ? "dados de exemplo" : "os dados salvos neste navegador"}. Para toda a equipe ver os mesmos dados, conecte o banco na Vercel (veja <code>docs/banco-de-dados.md</code>).</p>`;
  } else if (estado.novo) {
    $("aviso").innerHTML = `<p class="aviso"><b>Dados de exemplo.</b> Nada foi cadastrado ainda. Use <a href="admin/">Editar dados</a> para começar.</p>`;
  }
  render();

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  $("theme").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("esteira-theme", root.dataset.theme); } catch (_) {}
    render();
  };
  // outra aba (ex.: o admin) salvou no modo local → atualiza
  addEventListener("storage", async e => { if (e.key === "controle-demandas-dados") { estado = await CD.carregar(); render(); } });
})();
</script>
</body>
</html>
